[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n24q02m-crg"
version = "3.35.0-beta.1"
description = "Token-efficient code review knowledge graph: semantic search and call-graph resolution."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11.5,<3.15"  # lts-exempt: n24q02m-hull requires >=3.11.5 and fastretrieval/onnxruntime lacks cp315 wheels on Python 3.15
authors = [{ name = "n24q02m" }]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "claude-code", "mcp", "mcp-server", "model-context-protocol", "cursor", "codex", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "fastmcp>=4.2.0,<5",
    "tree-sitter>=0.26.1,<1",
    "tree-sitter-language-pack>=1.25.2,<2",
    "networkx>=3.4,<4; python_version < '3.12'",
    "networkx>=3.7,<4; python_version >= '3.12'",
    "watchdog>=7.1.0,<8",
    "fastretrieval>=1.16.0b1,<2",
    "httpx",
    "pydantic-settings",
    # De-hosted shared core: token auth (3 modes), per-task model cells
    # (plain-HTTP OpenAI-spec, no litellm), server lifecycle lock, and the
    # provider key pool + account registry (multi-key/multi-account rotation).
    # Published on PyPI as `n24q02m-hull` (import packages stay `hull_core` /
    # `hull_web`).
    "n24q02m-hull>=0.11.0b1,<0.12",
    "Pygments>=2.21.0",
    "alembic>=1.20.1,<2",
    "defusedxml>=0.7.1",
    "protobuf>=7.36.2",
]

[project.scripts]
n24q02m-crg = "crg.cli:main"
crg = "crg.cli:main"
better-code-review-graph = "crg.cli:main"  # legacy command alias

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov",
    "pytest-timeout",
    "ruff==0.17.5",
    "syrupy",
    "ty==0.0.104",
]

[tool.uv]
# Resolve only releases at least 7 days old, the same hold Renovate's
# minimumReleaseAge puts on third-party packages. Without it Renovate's
# artifact step (`uv lock`) and lock file maintenance (`uv lock --upgrade`)
# pick up releases younger than the hold, and Renovate rejects the branch.
# fastretrieval and n24q02m-hull are released by this stack and consumed
# right after release, so they are exempt here and in renovate.json alike.
exclude-newer = "7 days"
exclude-newer-package = { fastretrieval = false, n24q02m-hull = false }

[tool.hatch.build.targets.wheel]
packages = ["src/crg"]

# Ship the alembic migrations directory inside the installed wheel as the
# top-level package ``crg_migrations`` so that
# ``GraphStore._run_alembic_upgrade`` can locate it via importlib.resources
# regardless of the install location.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "crg_migrations"
"rules" = "crg_security_rules"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ty.rules]
import-not-found = "ignore"
missing-attribute = "ignore"
possibly-missing-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "--tb=short -q -m 'not integration and not full and not e2e'"
markers = [
    "integration: integration tests (deselect with '-m not integration')",
    "full: full/real live MCP protocol tests (deselect with '-m not full')",
    "e2e: end-to-end MCP protocol tests over stdio and streamable-HTTP (deselect with '-m not e2e')",
    "slow: slow tests (deselect with '-m not slow')",
]

[tool.coverage.run]
source = ["src/crg"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "def serve_main",
    "async def run_http",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", "server.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false
# version_toml only stamps pyproject.toml, but uv.lock also records this
# project's own version. Without a relock the release commit and its tag keep
# the previous version in uv.lock, so `uv sync --locked` on the tag fails.
# PSR runs this as one `sh -c`; `set -e` makes a failed lock stop the release.
build_command = """
set -e
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
