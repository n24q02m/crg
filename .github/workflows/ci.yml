name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # PR Title Lint (Conventional Commits subset)
  # ============================================================================
  # Squash-merge uses the PR title as the commit subject and bypasses the
  # local enforce-commit pre-commit commit-msg hook (bot PRs never run local
  # git hooks). Without a server-side check, a bot title like
  # "Sentinel: [HIGH] Fix ..." squash-merges with a non-conventional subject
  # -> PSR's commit parser silently ignores it -> no version bump, even for a
  # security fix. This job only surfaces a red check; it does not block
  # merge (no required-status-check rule), so the person merging still must
  # retype the squash-commit subject to start with fix:/feat: when this is red.
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff check
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: uv run --no-sync ty check

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Runs for bot actors too. The "Main Ruleset" requires CodeQL results to
    # merge, and this repo has code-scanning default setup disabled, so this
    # job is the only producer of those results. Excluding dependabot and
    # renovate left every dependency PR permanently blocked and merged only
    # via --admin, which bypasses the whole ruleset rather than just CodeQL.
    # Dependency changes are also the changes most worth scanning.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
