name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      publish_existing_tag:
        description: "Recovery only: publish an already-created tag (e.g. v3.1.0), skipping semantic-release. Use when the auto-computed version's tag name is permanently reserved by a GitHub immutable release."
        required: false
        type: string
        default: ""
      legacy_final_note:
        description: "One-time: also publish the FINAL better-code-review-graph stub (legacy/better-code-review-graph: rename note + legacy better-code-review-graph command, depends on n24q02m-crg) before the old PyPI project freezes. Set true only on the first n24q02m-crg release."
        required: false
        type: boolean
        default: false

env:
# Release lane: dispatch-only (release_type=beta|stable); push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # =================== Release ===================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Dry-run PSR (no_operation_mode => --noop: no commit/tag/push/release) purely to
      # learn the version it WOULD publish, so the PyPI-collision guard below can fire
      # BEFORE the real run creates a git tag or GitHub Release. Same action + SHA and
      # same prerelease inputs as the real step, run against the same untouched checkout.
      - uses: n24q02m/better-semantic-release@0cc137a9f9254fb4163d727c20026cb81a5a6880 # v1.13.1
        id: dryrun
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
          no_operation_mode: true

      # PSR silently no-ops when it can't find a fix:/feat: commit since the last
      # tag -- e.g. a bot PR squash-merged with a non-conventional subject (the
      # commit-title no-bump trap the pr-title CI check guards at merge time; this
      # step is the release-time backstop for anything that slipped past it, or a
      # repo predating that check). released=false alone is not an error (it is
      # the normal outcome of a docs-only/chore-only window), so this only warns.
      - name: Warn if commits exist since last tag but PSR computed no release
        if: inputs.publish_existing_tag == '' && steps.dryrun.outputs.released != 'true'
        run: |
          set -uo pipefail
          highest_tag="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$highest_tag" ]; then
            echo "No existing tags -- nothing to compare."
            exit 0
          fi
          commit_count="$(git rev-list "${highest_tag}..HEAD" --count)"
          if [ "$commit_count" -gt 0 ]; then
            echo "::warning::PSR computed no release (released=false) but ${commit_count} commit(s) exist since ${highest_tag}. This is expected if they are all chore/docs-only, but if one of them should have bumped the version (e.g. a bot-authored fix squashed with a non-conventional subject), inspect 'git log ${highest_tag}..HEAD --oneline' before assuming there is nothing to release."
          else
            echo "OK: no commits since ${highest_tag} -- released=false is expected."
          fi

      # PyPI never allows reusing a version number. Fail early and loudly if the version
      # PSR intends to publish already exists, before any tag or Release is created --
      # this turns a silent release freeze (PSR sees a matching tag, sets released=false,
      # every publish job is skipped) or an opaque upload failure deep in `uv publish`
      # into one explicit, actionable error.
      - name: Guard against re-publishing an already-published PyPI version
        if: steps.dryrun.outputs.released == 'true'
        env:
          COMPUTED_VERSION: ${{ steps.dryrun.outputs.version }}
        run: |
          set -uo pipefail
          PKG='n24q02m-crg'
          URL="https://pypi.org/pypi/${PKG}/${COMPUTED_VERSION}/json"
          echo "Checking PyPI for ${PKG} ${COMPUTED_VERSION} before semantic-release tags anything..."

          # PyPI normalizes the version in the URL path (e.g. 1.2.3-beta.1 and 1.2.3b1
          # both resolve to the same release), so PSR's raw version output can be used
          # directly in the URL.
          #   200            -> exists         -> COLLISION
          #   404             -> not found      -> FREE
          #   anything else  -> network/registry error -> UNKNOWN, never treated as free
          http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL")

          if [ "$http_code" = "200" ]; then
            echo "::error::Computed release version ${COMPUTED_VERSION} already exists on PyPI as ${PKG}==${COMPUTED_VERSION}. PyPI NEVER allows re-publishing a version number, even one later yanked. This almost always means the git history diverged from what was actually published to PyPI. Do NOT retry the same version: bump PAST the already-published range (higher than any version ever published) and dispatch the release again."
            exit 1
          fi

          if [ "$http_code" = "404" ]; then
            echo "OK: ${PKG}==${COMPUTED_VERSION} is not on PyPI (404) -- safe to publish."
            exit 0
          fi

          echo "::error::Could not verify whether ${PKG}==${COMPUTED_VERSION} exists on PyPI: unexpected HTTP status ${http_code} from ${URL} (likely a transient network/registry error, rate limit, or outage). Refusing to proceed so a genuine collision cannot slip through as a false 'free'. Re-run the release once the registry is reachable."
          exit 1

      - uses: n24q02m/better-semantic-release@0cc137a9f9254fb4163d727c20026cb81a5a6880 # v1.13.1
        id: release
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: inputs.publish_existing_tag == '' && steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}
      - name: Use existing tag (immutable-release recovery)
        id: forced
        if: inputs.publish_existing_tag != ''
        run: |
          TAG="${{ inputs.publish_existing_tag }}"
          VERSION="${TAG#v}"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"

  # =================== Publish to PyPI ===================
  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Publish to PyPI
        run: uv publish

  # ============================================================================
  # One-time legacy final-note: publish the LAST better-code-review-graph release
  # -- a stub that only notes the rename to n24q02m-crg, re-declares the legacy
  # `better-code-review-graph` command and depends on n24q02m-crg, so the old
  # PyPI project freezes at that stub. It lives in
  # legacy/better-code-review-graph at a version one patch above the last real
  # release (3.31.0 -> 3.31.1), so it can never overtake a real release and no
  # version rewrite happens here. Gated by the legacy_final_note dispatch input
  # so it runs exactly once. PyPI trusted publishing (OIDC) like publish-pypi: no
  # token; the better-code-review-graph trusted publisher on PyPI must point at
  # this repo with environment `pypi` before the dispatch.
  # ============================================================================
  publish-pypi-legacy-final:
    name: Publish better-code-review-graph final rename stub
    needs: release
    if: >-
      inputs.legacy_final_note
      && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the legacy stub
        run: uv build --out-dir dist-legacy legacy/better-code-review-graph

      # A PyPI version number can never be reused, so prove the artifact is the
      # intended stub before uploading: legacy name, bumped version, inactive
      # classifier, dependency on the renamed distribution, legacy console script.
      - name: Verify the built artifact is the legacy stub
        run: |
          ls dist-legacy
          python3 - <<'EOF'
          import glob
          import pathlib
          import sys
          import tomllib
          import zipfile

          (stub_pyproject,) = pathlib.Path("legacy").glob("*/pyproject.toml")
          project = tomllib.loads(stub_pyproject.read_text(encoding="utf-8"))["project"]
          dist_key = project["name"].replace("-", "_")
          dist_info = f"{dist_key}-{project['version']}.dist-info"
          wheels = glob.glob(f"dist-legacy/{dist_key}-{project['version']}-*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, got {wheels}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = wheel.read(f"{dist_info}/METADATA").decode()
              entry_points = wheel.read(f"{dist_info}/entry_points.txt").decode()

          expected = [
              f"Name: {project['name']}",
              f"Version: {project['version']}",
              "Classifier: Development Status :: 7 - Inactive",
              *(f"Requires-Dist: {dep}" for dep in project["dependencies"]),
          ]
          missing = [line for line in expected if line not in metadata]
          missing += [
              f"{script} = "
              for script in project["scripts"]
              if f"{script} = " not in entry_points
          ]
          if missing:
              sys.exit(f"legacy stub metadata mismatch: {missing}")
          print(f"OK: {project['name']} {project['version']}")
          EOF

      - name: Publish the final better-code-review-graph stub to PyPI
        run: uv publish dist-legacy/*

  # =================== Publish to MCP Registry ===================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-pypi]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] | .version = $v]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # ============================================================================
  # Sync to Plugin Marketplace
  # ============================================================================
  sync-marketplace:
    name: Sync to Marketplace
    needs: [release]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          repositories: claude-plugins

      - name: Dispatch plugin sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/claude-plugins/dispatches \
            -f event_type=plugin-sync \
            -f 'client_payload[repo]=crg' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}'
