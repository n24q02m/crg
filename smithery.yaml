# Smithery configuration -- https://smithery.ai/docs/build/project-config
# Runs the server over stdio (its default transport). No config is required to
# start; optional cloud keys stay host-owned in the instance config's
# [models.*] cells or HULL_<TASK>_API_KEY env (see README).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({ command: 'uvx', args: ['--python', '3.13', 'n24q02m-crg'] })
